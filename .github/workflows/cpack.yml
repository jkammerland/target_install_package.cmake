name: CPack Integration Testing

on:
  push:
    branches: [ "integration", "master", "CPack-integration" ]
  pull_request:
    branches: [ "integration", "master" ]
  workflow_dispatch:

jobs:
  cpack-basic:
    name: CPack Basic Integration Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Release]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
            expected_generators: "TGZ;ZIP"
            expected_packages: ["MyLibrary-*.tar.gz", "MyLibrary-*.zip"]
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
            expected_generators: "TGZ;DEB;RPM"
            expected_packages: ["MyLibrary-*.tar.gz", "mylibrary-*.deb", "mylibrary-*.rpm"]
          - os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++
            expected_generators: "TGZ;DragNDrop"
            expected_packages: ["MyLibrary-*.tar.gz", "MyLibrary-*.dmg"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC Developer Command Prompt
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Bootstrap (packaging tools + gpg)
        shell: bash
        run: |
          set -euxo pipefail
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            bash ci/run.sh bootstrap --packaging-tools --gpg
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            bash ci/run.sh bootstrap --gpg
          fi

      - name: Run CPack basic suite
        shell: bash
        run: |
          set -euxo pipefail
          bash ci/run.sh cpack --suite basic --build-type "${{ matrix.build_type }}" \
            --cc "${{ matrix.c_compiler }}" --cxx "${{ matrix.cpp_compiler }}"

      - name: Upload CPack Artifacts with GPG Signatures
        uses: actions/upload-artifact@v4
        if: matrix.build_type == 'Release'
        with:
          name: cpack-packages-signed-${{ matrix.os }}
          path: |
            build/cpack/basic/build/*.tar.gz
            build/cpack/basic/build/*.zip
            build/cpack/basic/build/*.deb
            build/cpack/basic/build/*.rpm
            build/cpack/basic/build/*.dmg
            build/cpack/basic/build/*.sig
            build/cpack/basic/build/*.sha256
            build/cpack/basic/build/*.sha512
            build/cpack/basic/build/verify.sh
          retention-days: 7

  cpack-components:
    name: CPack Components Integration Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap (packaging tools)
        shell: bash
        run: |
          set -euxo pipefail
          bash ci/run.sh bootstrap --packaging-tools

      - name: Run CPack components suite
        shell: bash
        run: |
          set -euxo pipefail
          bash ci/run.sh cpack --suite components

  cpack-checksum-compatibility:
    name: CPack checksums (CMake ${{ matrix.cmake-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cmake-version: [3.25.0, 4.2.3]
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap exact CMake and Ninja
        shell: bash
        run: |
          set -euxo pipefail
          bash ci/run.sh bootstrap \
            --cmake-version "${{ matrix.cmake-version }}" \
            --ninja

      - name: Prove fallback and native checksum generation
        shell: bash
        run: |
          set -euxo pipefail
          cmake \
            -DTIP_REPO_ROOT="$PWD" \
            -DTIP_PROOF_TEST_ROOT="$PWD/build/cpack/checksums-${{ matrix.cmake-version }}" \
            -DTIP_CMAKE_GENERATOR=Ninja \
            -DTIP_CMAKE_MAKE_PROGRAM="$(command -v ninja)" \
            -P tests/cmake/proof_cpack_checksums_test.cmake

  sbom-api-compatibility:
    name: SBOM API (CMake ${{ matrix.cmake-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cmake-version: 4.3.4
            activation-value: ca494ed3-b261-4205-a01f-603c95e4cae0
          - cmake-version: 4.4.2
            activation-value: 2d856d6d-53e8-488b-a17f-d486d2cac317
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap exact CMake and Ninja
        shell: bash
        run: |
          set -euxo pipefail
          bash ci/run.sh bootstrap \
            --cmake-version "${{ matrix.cmake-version }}" \
            --ninja

      - name: Configure SBOM proof suite
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build/sbom-api -G Ninja \
            -DTARGET_INSTALL_PACKAGE_DISABLE_INSTALL=ON \
            -Dtarget_install_package_BUILD_TESTS=ON \
            -Dtarget_install_package_PROOF_SBOM_EXPERIMENTAL_VALUE="${{ matrix.activation-value }}"

      - name: Run SBOM proof suite
        shell: bash
        run: |
          set -euxo pipefail
          ctest --test-dir build/sbom-api \
            --output-on-failure \
            -R '^proof_sbom_'

  cpack-self-release:
    name: Self Release Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap (ninja + gpg)
        shell: bash
        run: |
          set -euxo pipefail
          bash ci/run.sh bootstrap --cmake-version 4.4.2 --ninja --gpg

      - name: Build signed self-release package
        shell: bash
        run: |
          set -euxo pipefail
          bash ci/run.sh cpack --suite self-release

      - name: Upload self-release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: target-install-package-self-release
          path: |
            build/cpack/self-release/packages/*.tar.gz
            build/cpack/self-release/packages/*.zip
            build/cpack/self-release/packages/*.sig
            build/cpack/self-release/packages/*.sha256
            build/cpack/self-release/packages/*.sha512
            build/cpack/self-release/packages/*.asc
            build/cpack/self-release/packages/*.spdx.json
          retention-days: 7

  cpack-cross-platform:
    name: CPack Cross-Platform Package and Signature Validation
    runs-on: ubuntu-latest
    needs: [cpack-basic]
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap (gpg)
        shell: bash
        run: |
          set -euxo pipefail
          bash ci/run.sh bootstrap --gpg

      - name: Download All Platform Artifacts
        uses: actions/download-artifact@v4
        with:
          path: build/cpack/artifacts

      - name: Analyze Cross-Platform Package and Signature Consistency
        shell: bash
        run: |
          set -euxo pipefail
          bash ci/run.sh cpack --suite cross-platform --artifacts-dir build/cpack/artifacts

  cpack-regression:
    name: CPack Regression Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run CPack regression suite
        shell: bash
        run: |
          set -euxo pipefail
          bash ci/run.sh cpack --suite regression
