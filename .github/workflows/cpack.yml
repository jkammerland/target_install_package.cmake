name: CPack Integration Testing

on:
  push:
    branches: [ "integration", "master", "CPack-integration" ]
  pull_request:
    branches: [ "integration", "master" ]
  workflow_dispatch:

jobs:
  cpack-basic:
    name: CPack Basic Integration Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Release]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
            expected_generators: "TGZ;ZIP"
            expected_packages: ["MyLibrary-*.tar.gz", "MyLibrary-*.zip"]
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
            expected_generators: "TGZ;DEB;RPM"
            expected_packages: ["MyLibrary-*.tar.gz", "mylibrary-*.deb", "mylibrary-*.rpm"]
          - os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++
            expected_generators: "TGZ;DragNDrop"
            expected_packages: ["MyLibrary-*.tar.gz", "MyLibrary-*.dmg"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC Developer Command Prompt
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Bootstrap (packaging tools + gpg)
        shell: bash
        run: |
          set -euxo pipefail
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            bash ci/run.sh bootstrap --packaging-tools --gpg
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            bash ci/run.sh bootstrap --gpg
          fi

      - name: Run CPack basic suite
        shell: bash
        run: |
          set -euxo pipefail
          bash ci/run.sh cpack --suite basic --build-type "${{ matrix.build_type }}" \
            --cc "${{ matrix.c_compiler }}" --cxx "${{ matrix.cpp_compiler }}"

      - name: Upload CPack Artifacts with GPG Signatures
        uses: actions/upload-artifact@v4
        if: matrix.build_type == 'Release'
        with:
          name: cpack-packages-signed-${{ matrix.os }}
          path: |
            build/cpack/basic/build/*.tar.gz
            build/cpack/basic/build/*.zip
            build/cpack/basic/build/*.deb
            build/cpack/basic/build/*.rpm
            build/cpack/basic/build/*.dmg
            build/cpack/basic/build/*.sig
            build/cpack/basic/build/*.sha256
            build/cpack/basic/build/*.sha512
            build/cpack/basic/build/verify.sh
          retention-days: 7

  cpack-components:
    name: CPack Components Integration Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap (packaging tools)
        shell: bash
        run: |
          set -euxo pipefail
          bash ci/run.sh bootstrap --packaging-tools

      - name: Run CPack components suite
        shell: bash
        run: |
          set -euxo pipefail
          bash ci/run.sh cpack --suite components

  cpack-appimage:
    name: Native AppImage Artifact Proof
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap exact CMake and Ninja
        shell: bash
        run: |
          set -euxo pipefail
          bash ci/run.sh bootstrap --cmake-version 4.2.3 --ninja

      - name: Download and verify pinned AppImage tools
        shell: bash
        run: |
          set -euxo pipefail
          tool_dir="$PWD/build/cpack/appimage-tools"
          mkdir -p "$tool_dir/patchelf"

          curl --fail --location --retry 3 \
            --output "$tool_dir/appimagetool-x86_64.AppImage" \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $tool_dir/appimagetool-x86_64.AppImage" | sha256sum --check --strict
          chmod +x "$tool_dir/appimagetool-x86_64.AppImage"
          (
            cd "$tool_dir"
            ./appimagetool-x86_64.AppImage --appimage-extract
            mv squashfs-root appimagetool-root
          )

          curl --fail --location --retry 3 \
            --output "$tool_dir/patchelf-0.18.0-x86_64.tar.gz" \
            https://github.com/NixOS/patchelf/releases/download/0.18.0/patchelf-0.18.0-x86_64.tar.gz
          echo "ce84f2447fb7a8679e58bc54a20dc2b01b37b5802e12c57eece772a6f14bf3f0  $tool_dir/patchelf-0.18.0-x86_64.tar.gz" | sha256sum --check --strict
          tar -xzf "$tool_dir/patchelf-0.18.0-x86_64.tar.gz" -C "$tool_dir/patchelf"

          curl --fail --location --retry 3 \
            --output "$tool_dir/runtime-x86_64" \
            https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          echo "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  $tool_dir/runtime-x86_64" | sha256sum --check --strict

          "$tool_dir/appimagetool-root/AppRun" --version
          "$tool_dir/patchelf/bin/patchelf" --version
          {
            echo "TIP_APPIMAGE_TOOL_EXECUTABLE=$tool_dir/appimagetool-root/AppRun"
            echo "TIP_APPIMAGE_PATCHELF_EXECUTABLE=$tool_dir/patchelf/bin/patchelf"
            echo "TIP_APPIMAGE_RUNTIME_FILE=$tool_dir/runtime-x86_64"
          } >> "$GITHUB_ENV"

      - name: Configure AppImage proof suite
        shell: bash
        run: |
          set -euxo pipefail
          old_cmake_version="$(/usr/bin/cmake --version | awk 'NR == 1 { print $3 }')"
          [[ "$(printf '%s\n' "$old_cmake_version" 4.2 | sort -V | head -n 1)" == "$old_cmake_version" ]]
          [[ "$old_cmake_version" != 4.2 ]]

          cmake -S . -B build/cpack/appimage-proof -G Ninja \
            -DTARGET_INSTALL_PACKAGE_DISABLE_INSTALL=ON \
            -Dtarget_install_package_BUILD_TESTS=ON \
            -Dtarget_install_package_PROOF_OLD_CMAKE_COMMAND=/usr/bin/cmake \
            -Dtarget_install_package_PROOF_APPIMAGE_TOOL_EXECUTABLE="$TIP_APPIMAGE_TOOL_EXECUTABLE" \
            -Dtarget_install_package_PROOF_APPIMAGE_PATCHELF_EXECUTABLE="$TIP_APPIMAGE_PATCHELF_EXECUTABLE" \
            -Dtarget_install_package_PROOF_APPIMAGE_RUNTIME_FILE="$TIP_APPIMAGE_RUNTIME_FILE"

      - name: Build, inspect, and run AppImage
        shell: bash
        run: |
          set -euxo pipefail
          ctest --test-dir build/cpack/appimage-proof \
            --output-on-failure \
            -R '^proof_cpack_appimage_'

      - name: Archive verified AppImage
        shell: bash
        run: |
          set -euxo pipefail
          package_dir="$PWD/build/cpack/appimage-proof/tests/proofs/cpack-appimage-real/packages"
          mapfile -t appimages < <(find "$package_dir" -maxdepth 1 -type f -name '*.AppImage' -print)
          [[ "${#appimages[@]}" -eq 1 ]]
          [[ -x "${appimages[0]}" ]]

          appimage_name="$(basename "${appimages[0]}")"
          archive="$package_dir/tip-appimage-example-x86_64.tar"
          tar --create --file "$archive" --directory "$package_dir" "$appimage_name"

          verify_dir="$package_dir/archive-check"
          mkdir -p "$verify_dir"
          tar --extract --file "$archive" --directory "$verify_dir"
          [[ -x "$verify_dir/$appimage_name" ]]

      - name: Upload verified AppImage archive
        uses: actions/upload-artifact@v4
        with:
          name: tip-appimage-example-x86_64
          path: build/cpack/appimage-proof/tests/proofs/cpack-appimage-real/packages/tip-appimage-example-x86_64.tar
          if-no-files-found: error
          retention-days: 7

  cpack-checksum-compatibility:
    name: CPack checksums (CMake ${{ matrix.cmake-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cmake-version: [3.25.0, 4.2.3]
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap exact CMake and Ninja
        shell: bash
        run: |
          set -euxo pipefail
          bash ci/run.sh bootstrap \
            --cmake-version "${{ matrix.cmake-version }}" \
            --ninja

      - name: Prove fallback and native checksum generation
        shell: bash
        run: |
          set -euxo pipefail
          cmake \
            -DTIP_REPO_ROOT="$PWD" \
            -DTIP_PROOF_TEST_ROOT="$PWD/build/cpack/checksums-${{ matrix.cmake-version }}" \
            -DTIP_CMAKE_GENERATOR=Ninja \
            -DTIP_CMAKE_MAKE_PROGRAM="$(command -v ninja)" \
            -P tests/cmake/proof_cpack_checksums_test.cmake

  sbom-api-compatibility:
    name: SBOM API (CMake ${{ matrix.cmake-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cmake-version: 4.3.4
            activation-value: ca494ed3-b261-4205-a01f-603c95e4cae0
          - cmake-version: 4.4.2
            activation-value: 2d856d6d-53e8-488b-a17f-d486d2cac317
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap exact CMake and Ninja
        shell: bash
        run: |
          set -euxo pipefail
          bash ci/run.sh bootstrap \
            --cmake-version "${{ matrix.cmake-version }}" \
            --ninja

      - name: Configure SBOM proof suite
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build/sbom-api -G Ninja \
            -DTARGET_INSTALL_PACKAGE_DISABLE_INSTALL=ON \
            -Dtarget_install_package_BUILD_TESTS=ON \
            -Dtarget_install_package_PROOF_SBOM_EXPERIMENTAL_VALUE="${{ matrix.activation-value }}"

      - name: Run SBOM proof suite
        shell: bash
        run: |
          set -euxo pipefail
          ctest --test-dir build/sbom-api \
            --output-on-failure \
            -R '^proof_sbom_'

  cpack-self-release:
    name: Self Release Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap (ninja + gpg)
        shell: bash
        run: |
          set -euxo pipefail
          bash ci/run.sh bootstrap --cmake-version 4.4.2 --ninja --gpg

      - name: Build signed self-release package
        shell: bash
        run: |
          set -euxo pipefail
          bash ci/run.sh cpack --suite self-release

      - name: Upload self-release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: target-install-package-self-release
          path: |
            build/cpack/self-release/packages/*.tar.gz
            build/cpack/self-release/packages/*.zip
            build/cpack/self-release/packages/*.sig
            build/cpack/self-release/packages/*.sha256
            build/cpack/self-release/packages/*.sha512
            build/cpack/self-release/packages/*.asc
            build/cpack/self-release/packages/*.spdx.json
          retention-days: 7

  cpack-cross-platform:
    name: CPack Cross-Platform Package and Signature Validation
    runs-on: ubuntu-latest
    needs: [cpack-basic]
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap (gpg)
        shell: bash
        run: |
          set -euxo pipefail
          bash ci/run.sh bootstrap --gpg

      - name: Download All Platform Artifacts
        uses: actions/download-artifact@v4
        with:
          path: build/cpack/artifacts

      - name: Analyze Cross-Platform Package and Signature Consistency
        shell: bash
        run: |
          set -euxo pipefail
          bash ci/run.sh cpack --suite cross-platform --artifacts-dir build/cpack/artifacts

  cpack-regression:
    name: CPack Regression Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run CPack regression suite
        shell: bash
        run: |
          set -euxo pipefail
          bash ci/run.sh cpack --suite regression
