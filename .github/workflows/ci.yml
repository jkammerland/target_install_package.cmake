name: CMake Target Install Package CI

on:
  push:
    branches: [ "integration", "master" ]
  pull_request:
    branches: [ "integration", "master" ]
  workflow_dispatch:

jobs:
  cmake-sarif:
    name: CMake 4.4.2 configure diagnostics (SARIF)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Bootstrap exact CMake, Ninja, and fmt
        shell: bash
        run: |
          set -euxo pipefail
          bash ci/run.sh bootstrap --cmake-version 4.4.2 --ninja --fmt

      - name: Configure and generate SARIF
        id: configure
        shell: bash
        run: |
          set -euxo pipefail
          bash ci/run.sh sarif

      - name: Retain CMake SARIF artifact
        if: ${{ !cancelled() && steps.configure.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cmake-configure-sarif
          path: build/sarif/
          if-no-files-found: error
          retention-days: 7

      - name: Upload CMake diagnostics to code scanning
        if: >-
          ${{ !cancelled() && steps.configure.outcome == 'success' &&
              steps.configure.outputs.source_sarif_valid == 'true' &&
              (github.event_name == 'pull_request' ||
               (github.actor != 'dependabot[bot]' &&
                (github.event_name != 'push' ||
                 github.event.head_commit.author.username != 'dependabot[bot]'))) }}
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: build/sarif/cmake-configure.sarif
          category: cmake-configure

      - name: Note invalid source SARIF code scanning skip
        if: >-
          ${{ !cancelled() && steps.configure.outcome != 'skipped' &&
              steps.configure.outputs.source_sarif_valid != 'true' }}
        shell: bash
        run: echo "Code scanning upload skipped because CMake's original SARIF was missing or invalid; use the retained normalized artifact instead."

      - name: Note failed configure code scanning skip
        if: >-
          ${{ !cancelled() && steps.configure.outcome == 'failure' &&
              steps.configure.outputs.source_sarif_valid == 'true' }}
        shell: bash
        run: echo "Code scanning upload skipped because CMake configure/generate failed; use the retained valid but incomplete SARIF artifact instead."

      - name: Note restricted-token code scanning skip
        if: >-
          ${{ !cancelled() && steps.configure.outcome == 'success' &&
              steps.configure.outputs.source_sarif_valid == 'true' &&
              github.event_name != 'pull_request' &&
              (github.actor == 'dependabot[bot]' ||
               (github.event_name == 'push' &&
                github.event.head_commit.author.username == 'dependabot[bot]')) }}
        shell: bash
        run: echo "Code scanning upload skipped because this non-pull-request run has a Dependabot read-only token; use the retained SARIF artifact instead."

  cmake-feature-lanes:
    name: CMake ${{ matrix.cmake-version }} (${{ matrix.feature }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cmake-version: 3.25.0
            feature: core-floor
          - cmake-version: 3.28.4
            feature: modules-floor
          - cmake-version: 4.4.2
            feature: latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GCC 14 for the modules floor
        if: matrix.feature == 'modules-floor'
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14

      - name: Bootstrap exact CMake and Ninja
        shell: bash
        run: |
          set -euxo pipefail
          bootstrap_args=(--cmake-version "${{ matrix.cmake-version }}" --ninja)
          if [[ "${{ matrix.feature }}" != "modules-floor" ]]; then
            bootstrap_args+=(--fmt)
          fi
          bash ci/run.sh bootstrap "${bootstrap_args[@]}"

      - name: Prove the core CMake floor
        if: matrix.feature == 'core-floor'
        shell: bash
        run: |
          set -euxo pipefail
          bash ci/run.sh main --preset ci-release
          bash ci/run.sh consumer --preset ci-release

      - name: Prove the C++ modules floor
        if: matrix.feature == 'modules-floor'
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S examples/cxx-modules -B build/cmake-floor/modules -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_INSTALL_PREFIX="$PWD/build/cmake-floor/modules-install"
          cmake --build build/cmake-floor/modules --target math_modules
          cmake --install build/cmake-floor/modules

      - name: Configure the latest CMake feature lane
        if: matrix.feature == 'latest'
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . \
            --presets-file cmake/presets/CMakePresets-4.4.json \
            --preset ci-modern \
            -DCMAKE_PREFIX_PATH="$PWD/build/ci-deps/fmt-install" \
            -Werror=install-absolute-destination

      - name: Build, test, and install the latest CMake feature lane
        if: matrix.feature == 'latest'
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build/ci-modern
          cmake --build build/ci-modern --target all_verify_header_sets
          ctest --test-dir build/ci-modern --output-on-failure
          cmake --install build/ci-modern

  windows-clang-cl-modules:
    name: CMake 4.4.2 modules (Windows / Ninja / clang-cl)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Bootstrap exact CMake and Ninja
        shell: bash
        run: |
          set -euxo pipefail
          bash ci/run.sh bootstrap --cmake-version 4.4.2 --ninja

      - name: Build and install the C++ modules example
        shell: bash
        run: |
          set -euxo pipefail
          clang-cl --version
          cmake -S examples/cxx-modules -B build/clang-cl-modules -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-cl \
            -DCMAKE_CXX_COMPILER=clang-cl \
            -DCMAKE_INSTALL_PREFIX="$PWD/build/clang-cl-modules-install"
          cmake --build build/clang-cl-modules --target math_modules
          cmake --install build/clang-cl-modules

  build:
    name: Build (${{ matrix.os }} / ${{ matrix.c_compiler }} / ${{ matrix.build_type }}${{ matrix.compiler_variant && format(' / {0}', matrix.compiler_variant) || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Debug, Release, MinSizeRel, RelWithDebInfo]
        c_compiler: [gcc, clang, cl]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
          - os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++
            compiler_variant: appleclang
          - os: macos-latest
            c_compiler: /opt/homebrew/opt/llvm/bin/clang
            cpp_compiler: /opt/homebrew/opt/llvm/bin/clang++
            build_type: Release
            compiler_variant: homebrew
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: cl
          - os: macos-latest
            c_compiler: gcc
          - os: macos-latest
            c_compiler: cl
          # Skip MinSizeRel with GCC 14 due to C++ modules template instantiation issues with -Os
          - os: ubuntu-latest
            c_compiler: gcc
            build_type: MinSizeRel

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Homebrew Clang (macOS)
        if: runner.os == 'macOS' && matrix.compiler_variant == 'homebrew'
        run: |
          brew install llvm
          echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH

      - name: Derive build directory suffix
        id: dirs
        shell: bash
        run: |
          set -euo pipefail
          bt="${{ matrix.build_type }}"
          case "${bt}" in
            Debug) dir=debug ;;
            Release) dir=release ;;
            MinSizeRel) dir=minsizerel ;;
            RelWithDebInfo) dir=relwithdebinfo ;;
            *) echo "Unsupported build type: ${bt}" >&2; exit 1 ;;
          esac
          echo "build-dir-suffix=${dir}" >> "${GITHUB_OUTPUT}"

      - name: Bootstrap (Ninja + fmt)
        shell: bash
        run: |
          set -euxo pipefail
          bash ci/run.sh bootstrap \
            --ninja \
            --fmt \
            --build-type "${{ matrix.build_type }}" \
            --cc "${{ matrix.c_compiler }}" \
            --cxx "${{ matrix.cpp_compiler }}"

      - name: Main build/test/install
        shell: bash
        run: |
          set -euxo pipefail
          bash ci/run.sh main \
            --build-type "${{ matrix.build_type }}" \
            --cc "${{ matrix.c_compiler }}" \
            --cxx "${{ matrix.cpp_compiler }}"

      - name: Consumer build/run
        shell: bash
        run: |
          set -euxo pipefail
          bash ci/run.sh consumer \
            --build-type "${{ matrix.build_type }}" \
            --cc "${{ matrix.c_compiler }}" \
            --cxx "${{ matrix.cpp_compiler }}"

      - name: Upload Installation Artifacts
        uses: actions/upload-artifact@v4
        if: matrix.build_type == 'Release' && (matrix.c_compiler == 'gcc' || matrix.compiler_variant == 'appleclang')
        with:
          name: target-install-package-${{ matrix.os }}-${{ matrix.build_type }}-${{ matrix.compiler_variant || 'gcc' }}
          path: |
            build/ci/${{ steps.dirs.outputs.build-dir-suffix }}/install
            build/ci-deps/fmt-install
            !build/ci/${{ steps.dirs.outputs.build-dir-suffix }}/install/**/*.pdb
            !build/ci-deps/fmt-install/**/*.pdb
          retention-days: 7

  test-integration:
    name: Integration (ubuntu-latest)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap (Ninja + fmt)
        shell: bash
        run: |
          set -euxo pipefail
          bash ci/run.sh bootstrap --ninja --fmt --build-type Release

      - name: Download Installation Artifacts
        uses: actions/download-artifact@v4
        with:
          name: target-install-package-ubuntu-latest-Release-gcc
          path: install-artifacts

      - name: Integration tests (FetchContent + install prefix)
        shell: bash
        run: |
          set -euxo pipefail
          bash ci/run.sh consumer \
            --suite integration \
            --install-prefix install-artifacts/ci/release/install

  test-examples:
    name: Examples (${{ matrix.os }} / ${{ matrix.build_type }} / ${{ matrix.config_mode }}${{ matrix.compiler_variant && format(' / {0}', matrix.compiler_variant) || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Debug, Release]
        config_mode: [single, multi]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc-14
            cpp_compiler: g++-14
          - os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++
            compiler_variant: appleclang
          - os: macos-latest
            c_compiler: /opt/homebrew/opt/llvm/bin/clang
            cpp_compiler: /opt/homebrew/opt/llvm/bin/clang++
            compiler_variant: homebrew

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC Developer Command Prompt
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Modern GCC on Ubuntu (for C++ Modules)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14

      - name: Install Homebrew Clang on macOS (for C++ Modules)
        if: runner.os == 'macOS' && matrix.compiler_variant == 'homebrew'
        run: |
          brew install llvm
          echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH

      - name: Bootstrap (Ninja)
        shell: bash
        run: |
          set -euxo pipefail
          bash ci/run.sh bootstrap --ninja

      - name: Examples (single-config)
        if: matrix.config_mode == 'single'
        shell: bash
        run: |
          set -euxo pipefail
          bash ci/run.sh examples \
            --suite single \
            --build-type "${{ matrix.build_type }}" \
            --cc "${{ matrix.c_compiler }}" \
            --cxx "${{ matrix.cpp_compiler }}" \
            --use-fetchcontent

      - name: Examples (multi-config)
        if: matrix.config_mode == 'multi'
        shell: bash
        run: |
          set -euxo pipefail
          bash ci/run.sh examples \
            --suite multi \
            --build-type "${{ matrix.build_type }}" \
            --cc "${{ matrix.c_compiler }}" \
            --cxx "${{ matrix.cpp_compiler }}" \
            --use-fetchcontent

  multi-config-consume:
    name: Multi-config consume (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Bootstrap (Ninja)
        shell: bash
        run: |
          set -euxo pipefail
          bash ci/run.sh bootstrap --ninja

      - name: Consume suite (multi-config)
        shell: bash
        run: |
          set -euxo pipefail
          bash ci/run.sh examples --suite consume-multi-config

  single-config-consume:
    name: Single-config consume (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Bootstrap (Ninja)
        shell: bash
        run: |
          set -euxo pipefail
          bash ci/run.sh bootstrap --ninja

      - name: Consume suite (single-config)
        shell: bash
        run: |
          set -euxo pipefail
          bash ci/run.sh examples --suite consume-single-config

  fhs-combined-consume:
    name: FHS combined consume (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Bootstrap (Ninja)
        shell: bash
        run: |
          set -euxo pipefail
          bash ci/run.sh bootstrap --ninja

      - name: Consume suite (FHS combined)
        shell: bash
        run: |
          set -euxo pipefail
          bash ci/run.sh examples --suite consume-fhs-combined
